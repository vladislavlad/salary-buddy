schema: spec-driven

context: |
  Tech stack: React 19 + TypeScript (строгий, без any) + Vite, TanStack Query, shadcn/ui + Tailwind CSS, zod, Vitest; Temporal Polyfill + date-fns для дат; pnpm.
  Spec language: русский.

  Write every piece of prose in the spec language: the requirement statement, the requirement's own name after `Requirement:`, the scenario's name after `Scenario:`, the WHEN/THEN lines, the Purpose text – all of it.
  Keep unchanged only these: the markers `## Purpose`, `## Requirements`, `### Requirement:`, `#### Scenario:`; the keywords SHALL, WHEN, THEN; and code identifiers – class, function, file and field names, enum values, API terms.
  A marker is the marker alone. In `### Requirement: <name>` the part to keep is `### Requirement:` and `<name>` gets written in the spec language. Never leave a heading in English because the marker in front of it is English.

  Writing style: Technical (precise, implementation-focused)
  specStructure: flat

  Salary Buddy – клиентский калькулятор выплат в РФ: авансы, зарплаты, премии, доплаты, отпускные, больничные, прогрессивный НДФЛ. Без бэкенда, данные в localStorage. Строит календарь выплат на год; пользователь может задать фактическую сумму платежа, что пересчитывает НДФЛ для последующих выплат.

  ## Архитектура по фичам
  Каждая фича в src/features/<feature>/ слоями:
    model – application services, providers/context, доменные правила
    hooks – публичные React-хуки (без расчётной логики)
    repository – интерфейс и localStorage implementation
    ui – тонкие компоненты (данные через props/hooks)

  shared/ – только то, что используется несколькими фичами:
    lib – утилиты форматирования, денег, дат
    repository – общий Repository и LocalStorageRepository
    types – общие доменные типы и zod-схемы
    ui – shadcn/ui primitives и общие компоненты

  ## State management
  Feature providers + TanStack Query для чтения всех асинхронных источников + localStorage persistence.
  SalaryProvider, SalaryPaymentSettingsProvider, SurchargeProvider,
  BonusesProvider, VacationsProvider, SickLeavesProvider,
  CalendarProvider, PaymentsProvider.
  Локальные запросы: общий LOCAL_QUERY_KEY и LOCAL_QUERY_OPTIONS
  (networkMode: always, retry: false); внешние календари имеют отдельную сетевую политику.
  Хуки читают через Query; application services валидируют и сохраняют через repositories.
  После записи хук ожидает инвалидацию соответствующего запроса; после импорта — всех локальных.
  Данные репозитория не дублируются в useState/useEffect. React-состояние — формы, диалоги, read model выплат.
  Частичные обновления настроек сериализуются по экземпляру репозитория; ошибка не блокирует очередь.
  loading провайдеров покрывает первичное чтение и обновление (isFetching).
  Пересчёт ждёт завершения загрузки всех источников, включая настройки.
  Репозитории собираются в AppProviders и передаются пропсами; один граф репозиториев на QueryClient.

  ## Конвенции кода
  - Именованные экспорты по умолчанию
  - camelCase – переменные/функции, PascalCase – компоненты/типы
  - zod для валидации ввода и данных из persisted storage
  - TanStack Query — для асинхронных данных по правилам State management выше
  - Комментарии только на русском, только когда без них непонятно

  ## Критические правила
  - Salary и SalaryPaymentSettings – раздельные фичи, не склеивать
  - SickLeave и SickLeaveSettings – раздельные фичи
  - Payments – read model: рассчитываются, не редактируются (только fact)
  - Расчётную логику (features/payments/model/calculation/) не менять без запроса

rules:
  spec:
    - Описание на уровне бизнеса: что система делает, формулы, правила
    - Не описывать реализацию в коде: типы TS, импорты, архитектуру слоёв
    - Сценарии в формате GIVEN / WHEN / THEN
    - Язык – русский
  tasks:
    - Подзадачи, сгруппированные под высокими секциями
